<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مترجم كروم 2026</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Tajawal}body{background:#0f172a;color:#fff;padding:16px;min-height:100vh}header{text-align:center;padding:20px}h1{font-size:32px;background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.card{background:#ffffff0f;border:1px solid #ffffff1a;border-radius:20px;padding:16px;max-width:800px;margin:0 auto}select,textarea,button{width:100%;border-radius:12px;border:1px solid #334155;padding:12px;margin-top:8px}select{background:#1e293b;color:#fff}textarea{background:#0b1226;color:#fff;min-height:150px;font-size:18px}button{background:linear-gradient(90deg,#6366f1,#8b5cf6);color:#fff;border:none;font-weight:700;cursor:pointer;margin-top:10px;padding:14px}.row{display:flex;gap:8px}</style></head><body><header><h1>🚀 مترجم كروم 2026</h1><p style="color:#94a3b8">مشروع أحمد الشرعة</p></header><div class="card"><div class="row"><select id="f"><option value="en" selected>English</option><option value="ar">العربية</option><option value="fr">French</option><option value="de">German</option><option value="tr">Turkish</option></select><select id="t"><option value="ar" selected>العربية</option><option value="en">English</option><option value="fr">French</option><option value="de">German</option></select></div><textarea id="i" placeholder="اكتب هنا..."></textarea><textarea id="o" placeholder="الترجمة..." readonly></textarea><button id="b">ترجم الآن ✨</button><button id="c" style="background:#1e293b">نسخ الترجمة</button><div id="s" style="text-align:center;color:#94a3b8;margin-top:8px">جاهز</div></div><script>const i=document.getElementById('i'),o=document.getElementById('o'),f=document.getElementById('f'),t=document.getElementById('t'),b=document.getElementById('b'),s=document.getElementById('s');async function tr(){let x=i.value.trim();if(!x){s.textContent='اكتب نص';return}s.textContent='جاري...';try{let r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(x)+'&langpair='+f.value+'|'+t.value);let d=await r.json();o.value=d.responseData.translatedText;s.textContent='✅ تم'}catch(e){s.textContent='خطأ شبكة';}}b.onclick=tr;i.oninput=()=>{clearTimeout(window._t);window._t=setTimeout(tr,800)};document.getElementById('c').onclick=()=>{navigator.clipboard.writeText(o.value);s.textContent='تم النسخ'}</script></body></html>
